<!-- Холодняк Дмитро — Практична №3 — Таблиця -->
<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>Praktychna 3 - Tablycia</title>
    <style>
        table {
            align-items: center;
            border-collapse: collapse;
            background-color: sandybrown;
        }
        td {
            border: 1px solid black;
            text-align: center;
            font-size: 50pt;
            padding: 5px 50px 5px 50px;
        }
    </style>
</head>
<body>
<table>
    <tr>
        <td>1</td>
        <td>2</td>
        <td>3</td>
        <td>4</td>
    </tr>
    <tr>
        <td>5</td>
        <td rowspan="2" style="background-color: cornflowerblue">6</td>
        <td>7</td>
        <td>8</td>
    </tr>
    <tr>
        <td>9</td>
        <td>11</td>
        <td>12</td>
    </tr>
    <tr>
        <td>13</td>
        <td style="background-color: red">14</td>
        <td>15</td>
        <td>16</td>
    </tr>
    <tr>
        <td>17</td>
        <td style="background-color: red">18</td>
        <td>19</td>
        <td>20</td>
    </tr>
    <tr>
        <td>21</td>
        <td style="background-color: red">22</td>
        <td>23</td>
        <td>24</td>
    </tr>
    <tr>
        <td>25</td>
        <td style="background-color: lightgreen" colspan="3">26</td>
    </tr>
    <tr>
        <td>29</td>
        <td style="background-color: cornflowerblue">30</td>
        <td style="background-color: cornflowerblue">31</td>
        <td style="background-color: cornflowerblue">32</td>
    </tr>
</table>
</body>
</html>
